name: Build Flatpak

on:
  push:
    branches: [ main ]
    tags:
      - "claude-*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      auto_merge_pr:
        description: "Auto-merge PR number"
        required: false
        default: ""

env:
  APP_ID: ai.claude.Claude

jobs:
  post-renovate:
    runs-on: ubuntu-latest
    # Renovate branch names end with the group slug: renovate/<slug>, renovate/major-<slug>
    # and, with separateMultipleMajor, renovate/major-<N>-<slug>.
    if: github.event_name == 'pull_request' && github.actor == 'renovate[bot]' && startsWith(github.head_ref, 'renovate/') && (endsWith(github.head_ref, 'claude') || endsWith(github.head_ref, '7zip'))
    outputs:
      changes_detected: ${{ steps.commit.outputs.changes_detected }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - name: Capture dependency versions
        id: dependency-versions-before
        run: |
          set -eo pipefail
          versions="$(
            {
              grep -m 1 "url: https://downloads\.claude\.ai/claude-desktop/apt/" ${APP_ID}/${APP_ID}.yaml | sed -n 's#.*/claude-desktop_\([0-9][0-9.]*\)_[a-z0-9]*\.deb.*#claude=\1#p'
              grep -m 1 "url: https://github\.com/ip7z/7zip/releases/download/" ${APP_ID}/${APP_ID}.yaml | awk -F/ '{print "7zip=" $8}'
            } | sort
          )"
          {
            echo "versions<<EOF"
            printf "%s\n" "$versions"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update checksums
        if: endsWith(github.head_ref, 'claude')
        run: ./${APP_ID}/update-checksum.sh
      - name: Update metainfo
        if: endsWith(github.head_ref, 'claude')
        run: ./${APP_ID}/update-metainfo.sh
      - name: Update 7-Zip checksums
        if: endsWith(github.head_ref, '7zip')
        run: ./${APP_ID}/update-7zip-checksum.sh
      - name: Verify dependency versions unchanged
        env:
          BEFORE: ${{ steps.dependency-versions-before.outputs.versions }}
        run: |
          set -eo pipefail
          after="$(
            {
              grep -m 1 "url: https://downloads\.claude\.ai/claude-desktop/apt/" ${APP_ID}/${APP_ID}.yaml | sed -n 's#.*/claude-desktop_\([0-9][0-9.]*\)_[a-z0-9]*\.deb.*#claude=\1#p'
              grep -m 1 "url: https://github\.com/ip7z/7zip/releases/download/" ${APP_ID}/${APP_ID}.yaml | awk -F/ '{print "7zip=" $8}'
            } | sort
          )"
          if [ "$after" != "$BEFORE" ]; then
            echo "Dependency versions changed while refreshing checksums." >&2
            diff -u <(printf "%s\n" "$BEFORE") <(printf "%s\n" "$after") || true
            exit 1
          fi

      - name: Get last commit message
        id: last-commit
        run: |
          echo "message=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          echo "author=$(git log -1 --pretty=\"%an <%ae>\")" >> "$GITHUB_OUTPUT"
          echo "author_name=$(git log -1 --pretty=%an)" >> "$GITHUB_OUTPUT"
          echo "author_email=$(git log -1 --pretty=%ae)" >> "$GITHUB_OUTPUT"
      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_author: ${{ steps.last-commit.outputs.author }}
          commit_user_name: ${{ steps.last-commit.outputs.author_name }}
          commit_user_email: ${{ steps.last-commit.outputs.author_email }}
          commit_message: ${{ steps.last-commit.outputs.message }}
          commit_options: '--amend --no-edit'
          push_options: '--force'
          file_pattern: ${{ env.APP_ID }}/${{ env.APP_ID }}.yaml ${{ env.APP_ID }}/${{ env.APP_ID }}.metainfo.xml

  # update-checksum.sh is otherwise only ever run by post-renovate, on a Renovate
  # branch ending in `claude`. That left the signature verification it performs
  # -- and the key it trusts -- shipping without CI ever executing them, with the
  # first real run landing inside a PR that automerges itself. Gated like
  # extract-version so it sees the commit after post-renovate has settled.
  verify-pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: post-renovate
    if: >-
      always() && !cancelled() &&
      needs.post-renovate.result == 'skipped'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vendored signing key matches upstream
        run: |
          set -eo pipefail
          curl -fsSL https://downloads.claude.ai/claude-desktop/key.asc -o upstream-key.asc
          # Compare primary fingerprints rather than armor bytes: what the script
          # pins is the fingerprint, so a re-export or an added subkey should not
          # redden CI, while an actual key change must. Dearmor first -- gpg
          # --show-keys ignores armor blocks not labelled "PGP PUBLIC KEY BLOCK",
          # so reading the armored file directly would miss a relabelled second
          # key that APT would nonetheless load and trust.
          fingerprints() {
            gpg --dearmor < "$1" |
              gpg --batch --with-colons --show-keys |
              awk -F: '$1 == "pub" { want = 1; next } want && $1 == "fpr" { print $10; want = 0 }'
          }
          if [ "$(fingerprints ${APP_ID}/anthropic-apt-key.asc)" != "$(fingerprints upstream-key.asc)" ]; then
            echo "::error::Vendored signing key does not match downloads.claude.ai/claude-desktop/key.asc. If Anthropic rotated the key, re-vendor it and update the pinned fingerprint in update-checksum.sh together -- never one without the other."
            exit 1
          fi
          rm -f upstream-key.asc
      - name: Manifest pins match the signed index
        run: |
          set -eo pipefail
          ./${APP_ID}/update-checksum.sh
          if ! git diff --exit-code -- ${APP_ID}/${APP_ID}.yaml; then
            echo "::error::Manifest sha256/size do not match Anthropic's signed index. Run ./${APP_ID}/update-checksum.sh and commit the result."
            exit 1
          fi

  extract-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      version-changed: ${{ steps.extract-version.outputs.version-changed }}
    needs: post-renovate
    if: >-
      always() && !cancelled() &&
      needs.post-renovate.result == 'skipped'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Extract version
        id: extract-version
        run: |
          set -eo pipefail
          URL="$(grep -A 5 'filename: claude-desktop-amd64.deb' ${APP_ID}/${APP_ID}.yaml | grep -o 'url: .*' | head -1 | cut -d' ' -f2)"
          VERSION="$(echo "$URL" | sed -n 's#.*/claude-desktop_\([0-9][0-9.]*\)_amd64\.deb$#\1#p')"
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version from URL: $URL" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            # Initial commit: no parent to diff against, treat as new version.
            echo "version-changed=true" >> "$GITHUB_OUTPUT"
          elif git diff HEAD~1..HEAD -- ${APP_ID}/${APP_ID}.yaml | grep -q '^+.*url: https://downloads\.claude\.ai/claude-desktop/'; then
            echo "version-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version-changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    permissions:
      contents: read
      checks: write
    needs: extract-version
    if: >-
      always() && !cancelled() &&
      needs.extract-version.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup GPG
        env:
          GPG_KEY_GREP: ${{ vars.GPG_KEY_GREP }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: |
          set -eo pipefail
          gpg --list-keys --with-keygrip
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye
          echo "$GPG_PASSPHRASE" | /usr/libexec/gpg-preset-passphrase --preset "$GPG_KEY_GREP"
          echo "$GPG_PRIVATE_KEY" > repo.private.gpg
          gpg --import --batch repo.private.gpg
          rm repo.private.gpg
          rm -f repo.gpg
          gpg --export "$GPG_KEY_ID" > repo.gpg
      - name: Restore repository
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: |
          set -eo pipefail
          BASE_URL="$(gh api /repos/${GITHUB_REPOSITORY}/pages --jq .html_url)"
          curl -o/dev/null -sf "${BASE_URL}summary" || exit 0
          ostree --repo=repo init --mode=archive
          ostree --repo=repo remote add claude-flatpak "${BASE_URL%/}" --gpg-import=repo.gpg
          ostree --repo=repo pull --mirror claude-flatpak --depth=-1
          find repo/refs/heads/app repo/refs/heads/runtime -type f -not -name main -delete
          flatpak build-update-repo --gpg-sign="$GPG_KEY_ID" --generate-static-deltas --prune repo
          curl -o repo/config -sf "${BASE_URL}config"
          rm -rf repo/*.trustedkeys.gpg repo/extensions repo/state repo/tmp
      - name: Clean branch name
        id: clean-branch-name
        env:
          BRANCH: ${{ (github.ref_type == 'tag' && 'main') || github.head_ref || github.ref_name }}
        run: echo "branch=${BRANCH//\//-}" >> "$GITHUB_OUTPUT"
      - name: Build Flatpak
        id: build-flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          build-bundle: false
          upload-artifact: false
          manifest-path: ${{ env.APP_ID }}/${{ env.APP_ID }}.yaml
          branch: ${{ steps.clean-branch-name.outputs.branch }}
          gpg-sign: ${{ vars.GPG_KEY_ID }}
      - name: Create bundle
        id: create-bundle
        env:
          BRANCH: ${{ steps.clean-branch-name.outputs.branch }}
        run: |
          flatpak --user remote-add --no-gpg-verify build-repo repo
          flatpak --user install --noninteractive build-repo ${{ env.APP_ID }}//$BRANCH
          flatpak build-bundle ~/.local/share/flatpak/repo ${{ env.APP_ID }}.flatpak --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo ${{ env.APP_ID }} $BRANCH
      - name: Smoke test payload
        env:
          BRANCH: ${{ steps.clean-branch-name.outputs.branch }}
        run: |
          # apply_extra already ran during the install above and fails hard
          # if the .deb cannot be unwrapped. This step asserts the unpacked
          # tree actually landed where claude.sh execs it, so an upstream
          # layout change (payload no longer at usr/lib/claude-desktop, or
          # the native bindings dropped from app.asar.unpacked) fails the
          # build instead of shipping a launcher that dies at startup.
          set -eo pipefail
          loc="$(flatpak --user info --show-location ${APP_ID}//${BRANCH})"
          root="$loc/files/extra/claude"
          fail=0
          for path in \
            claude-desktop \
            chrome_crashpad_handler \
            resources/app.asar \
            resources/app.asar.unpacked/node_modules/@ant/claude-native/claude-native-binding.node \
            resources/TrayIconTemplate.png
          do
            if [ ! -f "$root/$path" ]; then
              echo "ERROR: missing from payload: $path" >&2
              fail=1
            fi
          done
          if [ ! -x "$root/claude-desktop" ]; then
            echo "ERROR: claude-desktop is not executable" >&2
            fail=1
          fi
          # zypak supplies the sandbox; a leftover non-setuid chrome-sandbox
          # next to the binary makes Chromium abort at startup.
          if [ -e "$root/chrome-sandbox" ]; then
            echo "ERROR: chrome-sandbox was not removed from the payload" >&2
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "Payload layout OK"
          exit "$fail"
      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_ID }}-x86_64.flatpak
          path: ${{ env.APP_ID }}.flatpak
      - name: Update repo
        id: update-repo
        env:
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: flatpak build-update-repo --gpg-sign="$GPG_KEY_ID" --generate-static-deltas --prune repo
      - name: Initialize github-pages
        id: init-github-pages
        run: |
          set -eo pipefail
          gpg_base64="$(base64 -w 0 repo.gpg)"
          cat > repo/claude.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Claude
          Url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          Homepage=https://claude.ai
          GPGKey=$gpg_base64
          EOF
          cat > repo/index.html <<EOF
          <!DOCTYPE html>
          <html>
            <head><title>Claude Flatpak Repository</title></head>
            <body>
              <h1>Claude</h1>
              <p>This is an unofficial Flatpak repository for Claude Desktop.</p>
              <pre>flatpak remote-add --if-not-exists claude-flatpak https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/claude.flatpakrepo
          flatpak install ${APP_ID}</pre>
            </body>
          </html>
          EOF
      - name: Upload repository as artifact (tags only)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-repo
          path: repo/
          retention-days: 30
      - name: Save pages artifact
        id: save-repo
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo/
      - name: Publish check result
        uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        if: always()
        with:
          token: ${{ github.token }}
          name: Build Result
          conclusion: >-
            ${{ (steps.build-flatpak.conclusion == 'success' && steps.save-repo.conclusion == 'skipped' && 'failure' ) || (steps.build-flatpak.conclusion == 'success' && steps.save-repo.conclusion) || steps.build-flatpak.conclusion }}
          output: |
            {
              "summary": "${{ (steps.build-flatpak.conclusion == 'success' && steps.save-repo.conclusion == 'skipped' && 'failure' ) || (steps.build-flatpak.conclusion == 'success' && steps.save-repo.conclusion) || steps.build-flatpak.conclusion }}",
              "text_description": "Build flatpak: ${{ steps.build-flatpak.conclusion }}\nUpdate repo: ${{ steps.update-repo.conclusion }}\nInit github pages: ${{ steps.init-github-pages.conclusion }}\nSave repo: ${{ steps.save-repo.conclusion }}"
            }

  auto-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    needs: [build, extract-version]
    if: >-
      always() && !cancelled() &&
      needs.build.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.ref_type != 'tag' &&
      needs.extract-version.outputs.version-changed == 'true'
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Download flatpak artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*.flatpak"
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: claude-linux-${{ needs.extract-version.outputs.version }}
          name: Claude ${{ needs.extract-version.outputs.version }}
          files: "*.flatpak"
          overwrite_files: true
          body: "Claude ${{ needs.extract-version.outputs.version }}"
          prerelease: true

  deploy:
    if: >-
      always() && !cancelled() &&
      github.ref_type == 'tag' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Download flatpak artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*.flatpak"
          merge-multiple: true
      - name: Publish flatpak
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: "*.flatpak"
          overwrite_files: true
          prerelease: false
      - name: Deploy github pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
