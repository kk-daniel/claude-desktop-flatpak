app-id: ai.claude.Claude
runtime: org.freedesktop.Sdk
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: claude
tags: [proprietary]
separate-locales: false
add-extensions:
  com.visualstudio.code.tool:
    directory: tools
    subdirectories: true
    version: '25.08'
    add-ld-path: lib
    no-autodownload: true
    autodelete: false
  org.freedesktop.Sdk.Extension.node24:
    directory: lib/sdk/node24
    version: '25.08'
    add-ld-path: lib
    no-autodownload: false
    autodelete: false
finish-args:
  - --require-version=0.10.3
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --env=LD_LIBRARY_PATH=/app/lib
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --env=ELECTRON_OZONE_PLATFORM_HINT=wayland
  # Sandbox-private ~/.claude for plugin manifests, marketplace cache, and
  # other Claude Code-shared state. Mapped at $HOME/.claude inside the
  # sandbox, stored at ~/.var/app/ai.claude.Claude/.claude/ on the host —
  # not shared with a host Claude Code CLI install.
  - --persist=.claude
  - --talk-name=org.freedesktop.Notifications
  # Keyring backends for Chromium's os_crypt. Without these, cookie/token
  # encryption falls back to the plaintext "basic" store and the app logs
  # "Error contacting kwalletd6" on every start. kwalletd5/6 cover KDE;
  # org.freedesktop.secrets is the generic Secret Service API behind
  # gnome-keyring and KeePassXC. klauncher5 is how Chromium asks Plasma 5 to
  # start kwalletd on demand — harmless on Plasma 6, where it no longer exists.
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.klauncher5
  # Notification-area / tray (StatusNotifierItem on KDE & GNOME-via-extension,
  # AppIndicator on Ubuntu/Cinnamon). Without these the SNI registration
  # silently fails under Flatpak and no icon appears. Modern Electron
  # registers the item by object path on its existing bus connection, so
  # we don't need to --own-name the per-PID SNI bus name.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=com.canonical.AppMenu.Registrar.*
  - --talk-name=com.canonical.indicator.application
  # libappindicator claims a per-PID bus name under
  # com.canonical.indicator.application; without ownership, the
  # registration call to the watcher silently no-ops.
  - --own-name=com.canonical.indicator.application.*
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gtk-doc
  - '*.la'
modules:
  # Needed only to crack the .deb's `ar` container at install time: binutils
  # lives in the SDK, but apply_extra runs against the Platform runtime. 7z
  # unwraps the ar member and its xz stream in one pass, yielding data.tar.
  - name: 7zip
    buildsystem: simple
    build-commands:
      - install -Dm755 7zz /app/bin/7zz
      - ln -s 7zz /app/bin/7z
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz
        sha256: 41aaba7b1235304ab5aa0624530c67ae829496cd29e875925271efdccc28c03e
        strip-components: 0
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-arm64.tar.xz
        sha256: 70ea6cc737ae1495ea2d7eb20ef3120fe579bd3f1a83a9d2362b62ec5bde2bba
        strip-components: 0

  - name: claude
    buildsystem: simple
    build-commands:
      - install -Dm755 claude.sh /app/bin/claude
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 ${FLATPAK_ID}-url-handler.desktop -t /app/share/applications
      - install -Dm644 ${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - mkdir -p /app/extra/claude
      - mkdir -p /app/lib/sdk/node24
      - mkdir -p /app/tools
      - ln -s /app/lib/sdk/node24/bin/node /app/bin/node
      - ln -s /app/lib/sdk/node24/bin/npm /app/bin/npm
      - ln -s /app/lib/sdk/node24/bin/npx /app/bin/npx
      - ln -s /app/lib/sdk/node24/bin/corepack /app/bin/corepack
    sources:
      # Anthropic's official Linux build, from their APT repo. The .deb carries
      # its own Electron (see usr/lib/claude-desktop/version), the real
      # @ant/claude-native and node-pty binaries, and the Linux tray/locale
      # resources — so no Electron download, asar repack, or native stubs are
      # needed. Index:
      # https://downloads.claude.ai/claude-desktop/apt/stable/dists/stable/main/binary-amd64/Packages
      - type: extra-data
        filename: claude-desktop-amd64.deb
        only-arches: [x86_64]
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_1.26832.0_amd64.deb
        sha256: 2bc6f0d4109bb43b307696e1128df53fbf393ef98f947a7869948642450245d7
        size: 171906316
      - type: extra-data
        filename: claude-desktop-arm64.deb
        only-arches: [aarch64]
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_1.26832.0_arm64.deb
        sha256: c2810fd68b2410f8326e80a45573d2f3e7bcd51aaf810d9ae92d3c0978a1d553
        size: 163828752
      - type: file
        path: apply_extra
      - type: file
        path: claude.sh
      - type: file
        path: ai.claude.Claude.metainfo.xml
      - type: file
        path: ai.claude.Claude.desktop
      - type: file
        path: ai.claude.Claude-url-handler.desktop
      - type: file
        path: ai.claude.Claude.svg
